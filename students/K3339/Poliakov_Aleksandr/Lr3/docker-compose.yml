services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: finance_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"

  api:
    build:
      context: ../Lr1
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DB_URL: postgresql://postgres:postgres@db:5432/finance_db
      PARSER_URL: http://parser:8001
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      JWT_SECRET: 83thfg20fj2908fgh9209frhy
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_MINUTES: "30"
    depends_on:
      db:
        condition: service_healthy
      parser:
        condition: service_started
      redis:
        condition: service_started
    # схему создаёт init_db на старте app; alembic-миграция Lr1 падает на чистом томе
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  parser:
    build:
      context: ..
      dockerfile: Lr3/parser/Dockerfile
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      DB_URL: postgresql://postgres:postgres@db:5432/finance_db
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8001

  worker:
    build:
      context: ..
      dockerfile: Lr3/parser/Dockerfile
    restart: unless-stopped
    environment:
      DB_URL: postgresql://postgres:postgres@db:5432/finance_db
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: celery -A celery_app.celery worker --loglevel=info

volumes:
  pgdata:
